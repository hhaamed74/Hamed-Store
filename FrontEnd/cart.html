<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | Hamed Store</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cart.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <a href="index.html" class="logo">HAMED<span>STORE</span></a>
        <div class="nav-right">
          <a href="index.html" class="back-link">Continue Shopping</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1 class="page-title">Your Shopping Cart</h1>

      <div class="cart-wrapper">
        <div id="cart-items" class="cart-items-list"></div>

        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">$0</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span class="free">Free</span>
          </div>
          <hr />
          <div class="summary-row total">
            <span>Total</span>
            <span id="final-total">$0</span>
          </div>
          <button class="btn-checkout" onclick="processCheckout()">
            Confirm & Order Now
          </button>
        </div>
      </div>
    </main>

    <script src="cart.js"></script>
  </body>
</html>
